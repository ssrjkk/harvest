<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">

  <link rel="stylesheet" href="/static/vendor/tabler.min.css">

  <link rel="stylesheet" href="/static/app.css?v=5">

<body class="d-flex flex-column bg-body-tertiary">
  <div class="page page-center">
    <div class="container container-tight py-4">
      <div class="card card-md">
        <div class="card-body">
          <div class="d-flex justify-content-end mb-2">
            <div class="btn-group">
              <button class="btn btn-sm" id="thDark" title="Тёмная"><i class="ti ti-moon"></i></button>
              <button class="btn btn-sm" id="thLight" title="Светлая"><i class="ti ti-sun"></i></button>
            </div>
          </div>
          <h2 class="h2 text-center mb-4">
            <span class="hx-brand justify-content-center"><span class="mark">H</span><span>HARVEST<small>FARM CONTROL</small></span></span>
          </h2>
          <div id="err" class="alert alert-danger" style="display:none"></div>

            <i class="ti ti-brand-google me-1"></i>Войти через Google
          </button>
          <div id="sep" class="hr-text" style="display:none">или</div>

          <form id="pwForm" style="display:none" autocomplete="off">
            <div class="mb-2">
              <input class="form-control mono" type="password" id="pw" placeholder="мастер-ключ" autocomplete="off">
            </div>
            <div class="form-footer">
              <button class="btn btn-primary w-100" id="pwSubmit" type="submit">Войти</button>
            </div>
          </form>
        </div>
      </div>
      <div class="text-center text-secondary mt-3 mono" style="font-size:11px">В Telegram Mini App войдёт сам</div>
    </div>
  </div>

  <script src="/static/login.js?v=5"></script>
