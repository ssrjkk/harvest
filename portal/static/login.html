<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>harvest — вход</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%2316150F' stroke-width='2'/%3E%3Cpath d='M8 22 L16 8 L22 22 Z' fill='%232E4A22'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/app.css?v={{HARVEST_VERSION}}">
</head>
<body>
  <div id="mouseGlow"></div>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo">H</div>
        <h2>harvest</h2>
        <div class="sub">Farm Control</div>
      </div>

      <div class="login-error" id="err"></div>

      <button class="login-btn login-btn-outline" id="btnGoogle" style="display:none">
        <i class="ti ti-brand-google"></i> Войти через Google
      </button>
      <div class="login-sep" id="sep" style="display:none">или</div>

      <form id="pwForm" style="display:none" autocomplete="off">
        <input class="login-input" type="password" id="pw" placeholder="мастер-ключ" aria-label="мастер-ключ" autocomplete="off">
        <button class="login-btn login-btn-primary" id="pwSubmit" type="submit">Войти</button>
      </form>

      <div class="login-footer">В Telegram Mini App отдельный вход не нужен — открывается по кнопке из бота</div>
    </div>
  </div>

  <script src="/static/login.js?v={{HARVEST_VERSION}}"></script>
</body>
</html>
