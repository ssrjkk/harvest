<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>HARVEST PORTAL — вход</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo"><span class="badge">H</span><span>HARVEST</span></div>
    <h1>Вход в портал</h1>
    <p>Единый доступ: Google-аккаунт или мастер-ключ фармера</p>

    <div id="err" style="display:none;color:var(--red);text-align:center;margin-bottom:12px"></div>

    <button class="btn full" id="btnGoogle" style="display:none;background:transparent;border:1px solid var(--accent)">
      Войти через Google
    </button>
    <div id="sep" class="sep" style="display:none">или</div>

    <form id="pwForm" style="display:none" autocomplete="off">
      <input class="fld" type="password" id="pw" placeholder="Мастер-ключ (FARMER_MASTER_KEY)">
      <button class="btn full" id="pwSubmit" type="submit">Войти по паролю</button>
    </form>

    <p class="mt muted" style="font-size:12px">Нет ни того ни другого? Внутри Telegram кнопка Mini App войдёт сама.</p>
  </div>

  <script src="/static/login.js"></script>
</body>
</html>
