name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Раз в неделю: CVE может появиться и без коммита — гейт pip-audit должен
  # ловить его, а не ждать следующего пуша.
  schedule:
    - cron: "17 5 * * 1"

# CI только читает репозиторий: права объявлены явно, иначе job с умолчанию
# write-all получает запись в репозиторий «на всякий случай».
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-portal.txt -r requirements-dev.txt

      - name: Lockfile freshness
        run: python tools/make_lock.py --check

      - name: Linter
        run: python -m ruff check --select=E,F,W --target-version=py314 --line-length=120 .

      - name: Security scan (bandit)
        run: python -m bandit -r core portal main.py auto.py -c .bandit -ll -q

      - name: Dependency audit (pip-audit)
        # Падает на любой известной CVE. До этого шаг был «информационным»
        # (`|| echo`) и запускался с --disable-pip без хешей: pip-audit сразу
        # ошибался, ошибка проглатывалась — фактической проверки не было.
        # Здесь собирается временное окружение по объявленным диапазонам;
        # границы подняты под пропатченные версии (cryptography >=50 закрывает
        # PYSEC-2026-3552/-3553).
        run: python -m pip_audit --strict -r requirements.txt -r requirements-portal.txt

      # Один полный прогон, два строгих гейта по отчёту (раньше сьют
      # гонялся дважды целиком). Источник измерения — тот же .coveragerc.
      - name: Tests (full suite)
        run: >
          python -m pytest -q
          --cov=portal --cov=core
          --cov-report=xml
          --cov-config=.coveragerc

      - name: Portal coverage gate (100%)
        run: python -m coverage report --include="portal/*" --fail-under=100

      - name: Core coverage gate (100%)
        run: python -m coverage report --include="core/*" --fail-under=100
