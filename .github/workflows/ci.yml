name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-portal.txt -r requirements-dev.txt

      - name: Linter
        run: python -m ruff check --select=E,F,W --target-version=py312 --line-length=120 .

      - name: Security scan (bandit)
        run: python -m bandit -r core portal main.py auto.py -c .bandit -ll -q

      - name: Tests (full suite + 95% portal coverage)
        run: >
          python -m pytest -q
          --cov=portal --cov-report=term
          --cov-config=.coveragerc
          --cov-fail-under=95

      - name: Core coverage (80%)
        run: >
          python -m pytest -q
          --cov=core --cov-report=term-missing
          --cov-fail-under=80
