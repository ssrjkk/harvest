name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-portal.txt
          pip install ruff

      - name: Линтер
        run: python -m ruff check --select=E,F,W --target-version=py312 --line-length=120 .

      - name: Тесты (полный набор + покрытие портала 100%)
        run: >
          python -m pytest -q
          --cov=portal --cov-report=term
          --cov-config=.coveragerc
          --cov-fail-under=100