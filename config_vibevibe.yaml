# ============================================================
#  VIBEVIBE.FUN FARMER - КОНФИГУРАЦИЯ
# ============================================================
#  vibe/vibe — permissionless token launchpad на Robinhood Chain Testnet
#  5% сапплая для тестнет-участников. Контракты верифицированы в Blockscout.

network:
  name: "Robinhood Chain Testnet (vibe/vibe)"
  rpc_url: "https://rpc.testnet.chain.robinhood.com"
  chain_id: 46630
  explorer: "https://explorer.testnet.chain.robinhood.com"
  currency: "ETH"
  abi_path: "abi/vibevibe.json"

# ---------- Кошельки ----------
wallets:
  count: 50
  file: "wallets.json"
  generate_if_missing: true

# ---------- Кран ----------
faucet:
  enabled: true
  min_balance: 0.005
  target_balance: 0.05
  retries: 3
  max_concurrent: 8
  strategies:
    - type: "chainstack"
      url: "https://mcp.chainstack.com/mcp"
      network_param: "robinhood"
    - type: "direct"
      url: "https://faucet.testnet.chain.robinhood.com/claim"
  delay_between_requests: [5, 15]

# ---------- Действия ----------
# Работают без подписи tradeSigner: transfer, claimRewards, stake.
# buy/sell на VibePassMarket требуют EIP-712 подпись — ключ задаётся в
# vibevibe.signer_key ниже (или env FARMER_VIBE_SIGNER_KEY). Без ключа
# действие невыполнимо и адаптивные веса отключат его автоматически.
actions:
  - type: "transfer"
    weight: 0.4
    min_amount: 0.0001
    max_amount: 0.001
    target: "random_wallet"

  # VibeFuelRewards — клейм наград (no-arg, без подписи; no-op без стейка)
  - type: "vibevibe_mint"
    weight: 0.25
    contract: "0xBcE8D74f62Ef38511B54c7821aD4F645E1843920"
    method: "claimRewards"

  # VibeFuelStaking — стейкинг (нужен approve стейк-токена заранее;
  # стейк-токен 0x5B575A0E3d09c3D6d27B475e2eabB45d13bBd91B, мин. 100k)
  - type: "vibevibe_mint"
    weight: 0.15
    contract: "0x056DD2Ff629BF8Fa51F3Ec126843d96D1e39cf5e"
    method: "stake"
    min_amount: 100000
    max_amount: 100000

  # VibePassMarket — buy на bonding curve (EIP-712, нужен signer_key + lounge_id)
  - type: "vibevibe_buy"
    weight: 0.15
    contract: "0xe16f9C85729ab952DF278C0FF3E5462E8c2829e1"
    lounge_id: 1                 # id существующего лаунжа (регистрируются платформой)
    min_amount: 0.0001
    max_amount: 0.001

  # VibePassMarket — sell на bonding curve (EIP-712, нужен signer_key + lounge_id)
  - type: "vibevibe_sell"
    weight: 0.05
    contract: "0xe16f9C85729ab952DF278C0FF3E5462E8c2829e1"
    lounge_id: 1
    min_amount: 0.0001
    max_amount: 0.001

  # VibeLoungeRegistry — registerLounge (только REGISTRAR_ROLE платформы,
  # в пачном фарме не работает; оставлен для подписанных флоу)
  # - type: "vibevibe_register"
  #   weight: 0.0
  #   contract: "0xcCec5aaEBdeB697A6dE24281ae0f6A1a0a1C9596"
  #   uri: "https://vibevibe.fun"

# ---------- Ключ подписи tradeSigner (EIP-712 для buy/sell) ----------
# Это приватный ключ адреса, который рынок считает tradeSigner'ом
# (конструктор VibePassMarket). Обычному оператору его нет — без него
# buy/sell будут пропущены. Для тестов можно выставить свой ключ.
vibevibe:
  signer_key: ""                 # или env FARMER_VIBE_SIGNER_KEY

# ---------- Фарминг ----------
farming:
  actions_per_cycle: [3, 8]
  delay_between_actions: [5, 20]
  delay_between_cycles: [3600, 7200]
  skip_cycle_probability: 0.05

# ---------- Расширенные настройки ----------
advanced:
  check_balance_before_action: true
  force_farm: false
  gas_limit: 300000
  min_gas_for_action: 0.003

# ---------- Параллелизм ----------
threading:
  max_workers: 20
  rpc_threads: 0
  timeout_per_wallet: 0
  prune_log_every_cycles: 10

# ---------- Кэш RPC-вызовов ----------
cache:
  gas_price_ttl: 15
  balance_ttl: 10
  nonce_ttl: 30
  rpc_rate_limit: 50
  rpc_rate_floor: 0.2

# ---------- Прокси ----------
proxy:
  enabled: false
  list: []
  rotate: "sequential"

# ---------- База данных ----------
database:
  path: "farming_vibevibe.db"  # SQLite-файл ИЛИ PostgreSQL DSN: postgres://user:pass@host:5432/harvest
  master_key: "master.key"
  log_keep: 200000

# ---------- Лицензия ----------
license:
  enabled: false
  deploy_url: "https://raw.githubusercontent.com/YOUR_USER/YOUR_REPO/main/license.json"
  deploy_salt: "harvest-deploy-salt-v1"
  grace_days: 7
  cache_file: ".license_cache"

# ---------- Логирование ----------
logging:
  level: "INFO"
  file: "logs/farm.log"
  max_bytes: 10485760
  backup_count: 5
  console: true
  colors: true
