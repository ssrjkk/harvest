# ============================================================
#  ARC TESTNET (Minara.Fun) - КОНФИГУРАЦИЯ
#  Платформа для лаунча токенов с ликвидностью в USDC
#  Airdrop: OG-кошельки + торговый объем
# ============================================================

network:
  name: "Arc Testnet"
  rpc_url: "https://rpc.testnet.arc.network"         # рабочий: chain_id 5042002 подтверждён живым запросом
  chain_id: 5042002                                  # совпадает с ответом RPC
  explorer: "https://explorer.testnet.arc.network"    # НЕ РАБОТАЕТ: домен не резолвится (DNS)
  currency: "ARC"
  network_type: "arc"                                 # маркер сети для роутинга действий

# ---------- Кошельки ----------
wallets:
  count: 50
  file: "wallets_arc.json"
  generate_if_missing: true

# ---------- Кран ----------
faucet:
  enabled: true
  min_balance: 0.01
  target_balance: 0.1
  retries: 3
  max_concurrent: 8            # параллельных запросов к крану (защита от rate limit)
  strategies:
    - type: "direct"
      url: "https://faucet.testnet.arc.network/claim"    # ЗАМЕНИТЬ
    - type: "direct"
      url: "https://faucet.testnet.arc.network/drip"     # ЗАМЕНИТЬ
  delay_between_requests: [5, 15]

# ---------- Действия ----------
# Ключевое отличие Arc: launch токенов + trade для объема
actions:
  # Launch: создание нового токена с ликвидностью в USDC
  - type: "arc_launch"
    weight: 0.3
    contract: "0x0000000000000000000000000000000000000000"    # ЗАМЕНИТЬ на token factory
    method: "launchToken"
    min_amount: 0.001
    max_amount: 0.01
    # launch_params:
    #   name_prefix: "MEME"        # префикс для имени токена
    #   symbol_prefix: "MEME"      # префикс для символа
    #   initial_liquidity: 0.005   # USDC ликвидность при лаунче

  # Trade: покупка/продажа токенов для генерации объема
  - type: "arc_trade"
    weight: 0.35
    contract: "0x0000000000000000000000000000000000000000"    # ЗАМЕНИТЬ на DEX/router
    method: "swap"
    min_amount: 0.0001
    max_amount: 0.005

  # Transfer: стандартный трансфер
  - type: "transfer"
    weight: 0.2
    target: "random_wallet"
    min_amount: 0.0001
    max_amount: 0.003

  # Liquidity: добавление ликвидности в пулы
  - type: "arc_add_liquidity"
    weight: 0.15
    contract: "0x0000000000000000000000000000000000000000"    # ЗАМЕНИТЬ на pool factory
    method: "addLiquidity"
    min_amount: 0.001
    max_amount: 0.005

# ---------- Фарминг ----------
farming:
  actions_per_cycle: [5, 12]       # Много действий — генерируем объем
  delay_between_actions: [2, 10]   # Быстрее — Arc проще транзакции
  delay_between_cycles: [1200, 2400]  # 20-40 мин
  skip_cycle_probability: 0.03

# ---------- Расширенные настройки ----------
advanced:
  check_balance_before_action: true
  force_farm: false
  gas_limit: 200000
  min_gas_for_action: 0.005
  max_consecutive_failures: 15

# ---------- Параллелизм ----------
threading:
  max_workers: 30
  rpc_threads: 0
  timeout_per_wallet: 0
  prune_log_every_cycles: 10

# ---------- Кэш RPC-вызовов ----------
cache:
  gas_price_ttl: 15
  balance_ttl: 10
  nonce_ttl: 30
  rpc_rate_limit: 80
  rpc_rate_floor: 0.2               # нижняя граница скорости при деградации узла

# ---------- Прокси ----------
proxy:
  enabled: false
  list: []
  rotate: "sequential"

# ---------- База данных ----------
database:
  path: "farming_arc.db"
  master_key: "master_arc.key"
  log_keep: 200000

# ---------- Лицензия ----------
license:
  enabled: false
  deploy_url: ""
  deploy_salt: "harvest-deploy-salt-v1"
  grace_days: 7
  cache_file: ".license_cache_arc"

# ---------- Логирование ----------
logging:
  level: "INFO"
  file: "logs/farm_arc.log"
  max_bytes: 10485760
  backup_count: 5
  console: true
  colors: true
