# ============================================================
#  ROBINHOOD CHAIN FARMER PRO - КОНФИГУРАЦИЯ
# ============================================================
#  Для exe-сборки: скопируйте этот файл в config.yaml рядом с harvest.exe
#  (или запустите: harvest.exe --config config.yaml). ABI уже в бандле.

network:
  name: "Robinhood Chain Testnet"
  rpc_url: "https://rpc.testnet.chain.robinhood.com"
  chain_id: 46630
  explorer: "https://explorer.testnet.chain.robinhood.com"
  currency: "ETH"

# ---------- Кошельки ----------
wallets:
  count: 50                     # Количество для генерации (если нет сохранённых)
  file: "wallets.json"          # Файл для экспорта/импорта (опционально)
  generate_if_missing: true

# ---------- Кран ----------
faucet:
  enabled: true
  min_balance: 0.005            # Минимальный баланс для старта
  target_balance: 0.05          # Желаемый баланс после запроса
  retries: 3
  max_concurrent: 8            # параллельных запросов к крану (защита от rate limit)
  strategies:
    - type: "chainstack"
      url: "https://mcp.chainstack.com/request_testnet_funds"
      network_param: "robinhood"
    - type: "direct"
      url: "https://faucet.testnet.chain.robinhood.com/claim"
  delay_between_requests: [5, 15]

# ---------- Действия ----------
actions:
  - type: "transfer"
    weight: 0.4
    min_amount: 0.0001
    max_amount: 0.001
    target: "random_wallet"   # или конкретный адрес
  - type: "vibevibe_swap"
    weight: 0.35
    contract: "0x0000000000000000000000000000000000000000"    # Заменить на реальный адрес
    method: "swap"               # имя метода в ABI, если не swap
    min_amount: 0.0001
    max_amount: 0.001
  - type: "vibevibe_mint"
    weight: 0.25
    contract: "0x0000000000000000000000000000000000000000"     # Заменить на реальный адрес
    method: "mint"               # имя метода в ABI

# ---------- Фарминг ----------
farming:
  actions_per_cycle: [3, 8]    # Случайное число действий за цикл
  delay_between_actions: [5, 20]  # секунд
  delay_between_cycles: [3600, 7200]  # секунд (1-2 часа)
  skip_cycle_probability: 0.05   # 5% шанс пропустить цикл (имитация)

# ---------- Расширенные настройки ----------
advanced:
  check_balance_before_action: true
  force_farm: false              # true = фармить даже без баланса (для тестов/без крана)
  gas_limit: 300000              # контрактные вызовы требуют больше (минимум 50000)
  min_gas_for_action: 0.003      # мин. ETH для контрактного действия

# ---------- Индивидуальное поведение (анти-сибил) ----------
# Каждый кошелёк получает СТАБИЛЬНЫЙ профиль (детерминированно от адреса):
# своя активность, темп, паузы, суммы, газ и предпочтения действий.
# Кошельки не сливаются в единый ботовый паттерн; перезапуск не меняет поведение.
behavior:
  enabled: true                  # false = все ведут себя одинаково (нейтрально)
  activity: [0.5, 1.5]           # множитель активности: ниже = чаще пропускает циклы
  rest_probability: 0.05         # шанс кошелька пропустить N циклов "на отдых"
  rest_cycles: [1, 3]            # сколько циклов подряд отдыхает
  action_delay_scale: [0.7, 1.5] # разброс темпа действий (множитель задержек)
  cycle_delay_scale: [0.8, 1.8]  # разброс пауз между циклами
  action_mix: 0.4                # сила индивидуальных предпочтений по типам действий (0..1)
  amount_jitter: 0.25            # разброс сумм перевода (до ±25%)
  gas_deviation: 0.06            # отклонение gas price (до ±6%)
  odd_amount_prob: 0.15          # шанс "некруглой" суммы (0.0001234...)
  faucet_skip_prob: 0.1          # шанс не идти на кран при низком балансе
  daily_window: 0.3              # сила привязки к времени суток (0 = равномерно)
  burst_prob: 0.05               # шанс редкого всплеска активности (в 1.6 раза больше действий)
  burst_multiplier: 1.6

# ---------- Параллелизм ----------
# Масштаб: генерация ключей PBKDF2 частично отпускает GIL, ~60 кошельков/сек (2 потока).
# Фарм параллелится асинхронно через max_workers; RPC-потоки масштабируются авто.
# Кэш RPC-вызовов (см. cache:) снижает нагрузку при тысячах кошельков.
threading:
  max_workers: 20              # одновременных воркеров (асинхронных корутин) в фарме
  rpc_threads: 0               # 0 = авто (max_workers*3 или по ядрам CPU, потолок 128)
  timeout_per_wallet: 0        # 0 = авто: покрывает худший случай цикла (actions*delay+запас)
  prune_log_every_cycles: 10   # каждые N циклов подрезать actions_log (см. database.log_keep)

# ---------- Кэш RPC-вызовов ----------
# Уменьшает число RPC-запросов при масштабе: gas_price, балансы и network nonce
# запрашиваются раз в N секунд вместо каждого действия.
cache:
  gas_price_ttl: 15    # секунд — gas price стабилен, редко меняется
  balance_ttl: 10      # секунд — баланс в пределах цикла почти не меняется
  nonce_ttl: 30        # секунд — сверка с сетевым nonce; в пределах цикла
                        # локальный счётчик в БД корректен
  rpc_rate_limit: 50   # RPC-запросов/сек на воркера (адаптивно снижается при деградации узла)
  rpc_rate_floor: 0.2  # нижняя граница скорости при сбоях (если 50/сек -> минимум 10/сек)

# ---------- Прокси ----------
proxy:
  enabled: false
  list: []                     # или путь к файлу с прокси
  rotate: "sequential"         # sequential / random

# ---------- База данных ----------
database:
  path: "farming_state.db"     # SQLite для хранения прогресса
  master_key: "master.key"     # файл ключа для шифрования seed-данных в БД (или env FARMER_MASTER_KEY, 64 hex)
  log_keep: 200000             # сколько последних записей actions_log хранить (подрезка)

# ---------- Лицензия (доступ по паролю) ----------
# Владелец управляет доступом дистанционно: публикует license.json в GitHub
# (raw URL ниже) и в любой момент меняет пароль / отзывает копии.
#   1) вычислить hash нового пароля:  python -m core.license setpass НОВЫЙ_ПАРОЛЬ
#   2) обновить "pass" в license.json и запушить;
#   3) у клиентов новый пароль применится после следующего онлайн-запроса.
# Для раздачи включите enabled: true. Без пароля программа не запустится.
license:
  enabled: false               # true при раздаче клиентам
  deploy_url: "https://raw.githubusercontent.com/YOUR_USER/YOUR_REPO/main/license.json"
  deploy_salt: "harvest-deploy-salt-v1"   # соль для hash пароля (см. subcommand setpass)
  grace_days: 7                # дней работы офлайн после активации
  cache_file: ".license_cache" # подписанный кэш активации (локально)

# ---------- Логирование ----------
logging:
  level: "INFO"
  file: "logs/farm.log"
  max_bytes: 10485760
  backup_count: 5
  console: true
  colors: true
